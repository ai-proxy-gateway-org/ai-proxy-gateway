services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-proxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_proxy_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_proxy_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: ai-proxy-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_proxy_gateway}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
